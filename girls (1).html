<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMA GIRLS BASKETBALL Stats</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f5f5f5;background:#101010}*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:1200px;margin:auto}h1{color:#ffd22e;text-align:center;font-size:clamp(22px,4vw,36px);margin:6px 0 18px}p{line-height:1.4}.toolbar{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}button{background:#ffd22e;color:#111;border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#333;color:#fff;border:1px solid #777}input{background:#242424;color:#fff;border:1px solid #666;border-radius:4px;padding:7px;width:100%;min-width:58px}#email,#password{width:210px}.tablewrap{overflow-x:auto;border:1px solid #7b6417;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:1080px}th{background:#ffd22e;color:#111;padding:12px 8px;font-size:13px}td{padding:9px 6px;text-align:center;border-bottom:1px solid #333}tr:nth-child(even){background:#1c1c1c}td:nth-child(2){min-width:155px}td:nth-child(3){min-width:115px}.editing td{padding:4px}td input{text-align:center}td:nth-child(2) input{text-align:left}#status{text-align:center;color:#d9d9d9;min-height:20px;font-size:13px}.hint{text-align:center;color:#aaa;font-size:13px}#loginArea{display:none;justify-content:center;gap:8px;flex-wrap:wrap}#adminControls{display:none;justify-content:center;gap:8px;flex-wrap:wrap}button:disabled{opacity:.55;cursor:not-allowed}</style></head><body><main><div class="toolbar"><button id="loginToggle" class="secondary">Admin Login</button><div id="loginArea"><input id="email" type="email" autocomplete="username" placeholder="Admin email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login">Sign In</button></div><div id="adminControls"><button id="edit">Edit Stats</button><button id="save" style="display:none">Save Changes</button><button id="cancel" class="secondary" style="display:none">Cancel</button><button id="logout" class="secondary">Sign Out</button></div></div><div id="status" role="status">Loading stats…</div><div class="tablewrap"><table id="stats"><thead><tr><th>#</th><th>PLAYER</th><th>POSITION</th><th>GP</th><th>PTS</th><th>PPG</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>FG%</th><th>3P%</th><th>FT%</th></tr></thead><tbody></tbody></table></div><p class="hint">Stats are publicly viewable. Only authorized administrators can save edits.</p></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,onSnapshot,setDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const config={"apiKey": "AIzaSyB7xUXw219ORKGBE7nAN2p2-reaU1VnPcc", "authDomain": "rma-athlethics.firebaseapp.com", "projectId": "rma-athlethics", "storageBucket": "rma-athlethics.firebasestorage.app", "messagingSenderId": "352472938114", "appId": "1:352472938114:web:6547dcaa78681b2791e69b"};const app=initializeApp(config);const auth=getAuth(app),db=getFirestore(app);const ref=doc(db,'basketballStats','girls-basketball');
const keys=['number','player','position','gp','pts','ppg','reb','ast','stl','blk','fg','three','ft'];
const empty=()=>Array.from({length:12},(_,i)=>({number:String(i+1),player:'Player '+(i+1),position:'',gp:'0',pts:'0',ppg:'0',reb:'0',ast:'0',stl:'0',blk:'0',fg:'0',three:'0',ft:'0'}));
let rows=empty(),editing=false,loaded=false,authorized=false;
const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;
function render(){const body=$('stats').querySelector('tbody');body.replaceChildren();body.classList.toggle('editing',editing);for(let i=0;i<12;i++){const tr=document.createElement('tr');for(const key of keys){const td=document.createElement('td');if(editing){const input=document.createElement('input');input.value=(rows[i][key]??'')===''&& !['number','player','position'].includes(key)?'0':rows[i][key]??'';input.setAttribute('aria-label',`Player ${i+1} ${key}`);input.addEventListener('input',()=>rows[i][key]=input.value);td.append(input)}else{td.textContent=(rows[i][key]??'')===''&& !['number','player','position'].includes(key)?'0':rows[i][key]??''}tr.append(td)}body.append(tr)}}
function editMode(on){editing=on;$('edit').style.display=on?'none':'';$('save').style.display=on?'':'none';$('cancel').style.display=on?'':'none';render()}
onSnapshot(ref,snap=>{if(editing)return;const incoming=snap.data()?.players;rows=Array.from({length:12},(_,i)=>({...empty()[i],...(Array.isArray(incoming)?incoming[i]:{})}));loaded=true;render();status(snap.exists()?'Stats are up to date.':'No saved stats yet. An admin can add players and save.');},err=>status('Could not load stats: '+err.message));
onAuthStateChanged(auth,user=>{authorized=!!user;$('loginToggle').style.display=user?'none':'';$('loginArea').style.display='none';$('adminControls').style.display=user?'flex':'none';if(!user&&editing)editMode(false);});
$('loginToggle').onclick=()=>{$('loginArea').style.display=$('loginArea').style.display==='flex'?'none':'flex'};
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value='';status('Signed in. Click Edit Stats to make changes.')}catch(e){status('Sign-in failed: '+e.message)}};
$('logout').onclick=async()=>{await signOut(auth);status('Signed out.')};
$('edit').onclick=()=>{if(!loaded)return status('Wait for stats to load.');editMode(true)};
$('cancel').onclick=()=>{editMode(false);status('Changes canceled; loading saved stats…');};
$('save').onclick=async()=>{if(!authorized)return status('Sign in first.');$('save').disabled=true;try{await setDoc(ref,{players:rows,updatedAt:new Date().toISOString()});editMode(false);status('Changes saved for everyone.')}catch(e){status('Save failed: '+e.message+' Check your Firestore security rules.')}finally{$('save').disabled=false}};
</script></body></html>
